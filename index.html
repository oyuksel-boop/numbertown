<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F7B7A3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Isabel Leyla's Number Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2A3B; --cream:#FFF6EA; --paper:#fff;
  --terra:#E4694A; --mustard:#F2B33D; --sage:#6FB98F; --blue:#5B8FB9; --plum:#8D6BA0;
  --dusk1:#FFE3B8; --dusk2:#FFC49B; --dusk3:#D9A7C7;
  --sh:rgba(46,42,59,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:600; background:var(--cream); color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none;
}
h1,h2,h3{margin:0;font-weight:700}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.on{display:flex}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:22px;font:inherit;font-weight:700;color:#fff;background:var(--terra);
  padding:14px 22px;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;
  transition:transform .07s,box-shadow .07s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.sage{background:var(--sage)} .btn.blue{background:var(--blue)} .btn.plum{background:var(--plum)}
.btn.mustard{background:var(--mustard);color:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--sh)}
.btn.sm{padding:9px 15px;font-size:15px;border-radius:16px;white-space:nowrap}
.btn[disabled]{opacity:.4;pointer-events:none}
.ico{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:var(--ink);font-size:21px;
  box-shadow:0 4px 0 var(--sh);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;font-family:inherit}
.ico:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}

/* ---------- purse bar ---------- */
.purse{display:flex;gap:7px;align-items:center;padding:8px 10px;flex:0 0 auto}
.pill{background:#fff;border-radius:16px;padding:6px 11px;font-size:14px;font-weight:700;
  box-shadow:0 3px 0 var(--sh);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill b{font-size:16px}
.pill.risk{background:#FFF0D8}
.grow{flex:1}

/* ---------- town map ---------- */
#map{background:linear-gradient(180deg,var(--dusk3) 0%,var(--dusk2) 38%,var(--dusk1) 68%,#F6E2C0 100%)}
#townwrap{flex:1;position:relative;overflow-y:auto;overflow-x:hidden;padding:0 12px 18px}
#skyline{position:absolute;inset:0;pointer-events:none;z-index:0}
.welcome{position:relative;z-index:1;text-align:center;padding:6px 8px 10px}
.welcome h1{font-size:clamp(20px,5.6vw,28px);line-height:1.15}
.welcome p{margin:3px 0 0;font-size:13px;opacity:.7;font-weight:600}
.shops{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.shop{background:#fff;border:none;border-radius:20px;padding:9px 9px 11px;box-shadow:0 5px 0 var(--sh);
  cursor:pointer;font:inherit;color:var(--ink);text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center}
.shop:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sh)}
.shop svg{width:100%;height:auto;display:block}
.shop{position:relative}
.shop.busy{box-shadow:0 5px 0 var(--sh), 0 0 0 3px var(--mustard)}
.ribbon{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--mustard);
  color:var(--ink);font-size:10px;font-weight:700;padding:3px 9px;border-radius:9px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.12);z-index:2}
.frontage{position:relative;width:100%}
.frontage .keeper{position:absolute;right:-3px;bottom:-7px;width:29%}
.shop .nm{font-weight:700;font-size:14px;line-height:1.15}
.shop .tp{font-size:10.5px;opacity:.6;line-height:1.2;font-weight:600}
.stars{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.stars i{width:11px;height:11px;border-radius:50%;background:#E7DFD3;display:block}
.stars i.on{background:var(--mustard);box-shadow:0 0 0 2px #FFF0D0}
.stars i.shaky{background:#E9C77A;box-shadow:0 0 0 2px #FFF0D0}
.mapfoot{position:relative;z-index:1;display:flex;gap:9px;justify-content:center;padding:14px 0 4px;flex-wrap:wrap}
#street{position:relative;z-index:1;display:flex;justify-content:space-around;align-items:flex-end;
  padding:16px 4px 0;opacity:.92}
#street .walker{width:12%;max-width:56px;animation:bob 2.6s ease-in-out infinite}
#street .walker svg{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}

/* ---------- shop / question ---------- */
#shop{background:var(--cream)}
.shophead{display:flex;align-items:center;gap:9px;padding:7px 10px;flex:0 0 auto}
.shophead .who{width:44px;height:52px;flex:0 0 auto}
.shophead .ttl{font-size:16px;font-weight:700;line-height:1.1}
.shophead .sub{font-size:11.5px;opacity:.6;font-weight:600}
.qwrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:11px;padding:6px 14px;min-height:0}
.speech{background:#fff;border-radius:18px;padding:13px 16px;box-shadow:0 4px 0 var(--sh);
  font-size:clamp(16px,4.4vw,20px);line-height:1.35;text-align:center;max-width:520px;position:relative}
.speech:after{content:'';position:absolute;left:26px;bottom:-9px;border:10px solid transparent;
  border-top-color:#fff;border-bottom:0}
.talk{display:flex;flex-direction:column;align-items:flex-start;width:100%;max-width:520px}
.talk .speech{width:100%}
.talkwho{width:50px;margin:1px 0 0 8px;flex:0 0 auto}
.talkwho svg{width:100%;height:auto;display:block}
.pic{width:min(300px,84vw);height:auto;display:block;margin:0 auto}
.pic-sm{width:min(160px,42vw)}
.pics svg{flex:0 0 auto}
.pics{display:flex;flex-direction:column;gap:8px;align-items:center}
table.tt{border-collapse:collapse;font-size:15px;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 3px 0 var(--sh)}
table.tt th{background:var(--blue);color:#fff;padding:6px 16px;font-weight:700;font-size:13px}
table.tt td{padding:6px 16px;border-top:2px solid #F0E8DC;font-weight:600}

/* answer box */
.abox{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:9px 15px;
  box-shadow:0 4px 0 var(--sh);font-size:26px;font-weight:700;min-width:150px;justify-content:center}
.abox .cur{min-width:26px;border-bottom:4px solid var(--terra);padding:0 3px;text-align:center}
.abox .cur:empty:before{content:'?';opacity:.22}
.abox .un{font-size:16px;opacity:.6}
.abox.wrong{animation:nudge .45s}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.abox.right{background:#E4F6EA;box-shadow:0 4px 0 #B9E2C8}

/* keypad + choices */
.pad{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:6px 14px calc(10px + env(safe-area-inset-bottom));
  max-width:390px;margin:0 auto;width:100%}
.key{background:#fff;border:none;border-radius:14px;padding:13px 0;font:inherit;font-size:22px;font-weight:700;
  color:var(--ink);box-shadow:0 4px 0 var(--sh);cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.key.go{grid-column:span 3;background:var(--sage);color:#fff;font-size:19px}
.key.dim{background:#F4ECDF}
.opts{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px calc(12px + env(safe-area-inset-bottom));
  max-width:430px;margin:0 auto;width:100%}
.opt{background:#fff;border:none;border-radius:16px;padding:16px 8px;font:inherit;font-size:19px;font-weight:700;
  color:var(--ink);box-shadow:0 4px 0 var(--sh);cursor:pointer}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.opt.good{background:#DFF3E6;box-shadow:0 4px 0 #B4DEC4}
.opt.bad{background:#FFE7E1;box-shadow:0 4px 0 #F3C6BA}

/* helper / hint / solution */
.helper{background:#FFF3D6;border-radius:16px;padding:11px 14px;font-size:14.5px;line-height:1.4;
  max-width:520px;box-shadow:0 3px 0 #EBD9AE}
.helper b{color:var(--terra)}
.sol{background:#fff;border-radius:16px;padding:11px 14px;font-size:14.5px;line-height:1.55;
  max-width:520px;box-shadow:0 3px 0 var(--sh)}
.sol div{padding:2px 0}
.sol div:before{content:'→ ';opacity:.45}
.sol .tag.plain:before,.sol .ansline:before{content:''}
.sol .ansline{margin-top:7px;font-weight:700}
.tag{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;
  display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
.lvl{letter-spacing:.6px;padding:2px 8px;border-radius:9px;background:#E6EFE9;color:#2E2A3B;opacity:.95}
.lvl.l0{background:#DCEEDF} .lvl.l1{background:#FFE9C2} .lvl.l2{background:#EADCF5}
.reward{font-size:15px;font-weight:700;color:var(--sage)}
.fly{position:fixed;font-size:20px;font-weight:700;pointer-events:none;z-index:90}

/* ---------- bank ---------- */
#bank{background:linear-gradient(180deg,#EAF2F8 0%,var(--cream) 55%)}
.bankwrap{flex:1;overflow-y:auto;padding:4px 14px 24px;display:flex;flex-direction:column;gap:12px;align-items:center}
.jar{width:min(190px,46vw)}
.bigmoney{font-size:clamp(34px,11vw,52px);font-weight:700;line-height:1}
.meter{width:100%;max-width:420px;height:16px;border-radius:16px;background:#E7DFD3;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mustard),var(--sage));border-radius:16px}
.card{background:#fff;border-radius:18px;padding:13px 15px;box-shadow:0 4px 0 var(--sh);width:100%;max-width:420px}
.card h3{font-size:15px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;font-size:14.5px;padding:3px 0}
.row.tot{border-top:2px solid #F0E8DC;margin-top:5px;padding-top:7px;font-weight:700;font-size:16px}
.muted{opacity:.6;font-size:13px;line-height:1.45}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;background:rgba(46,42,59,.4);display:none;align-items:flex-end;z-index:80}
.sheet.on{display:flex}
.sheet .inner{background:var(--cream);width:100%;max-height:90%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:16px 15px calc(20px + env(safe-area-inset-bottom))}
.skillrow{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid #EFE6D8}
.skillrow .bar{flex:1;height:9px;border-radius:9px;background:#E7DFD3;overflow:hidden}
.skillrow .bar i{display:block;height:100%;background:var(--sage)}
.skillrow .st{width:20px;text-align:center}
input[type=range]{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.seg button{background:#fff;border:none;border-radius:13px;padding:7px 12px;font:inherit;font-size:13.5px;
  font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--sh)}
.seg button.off{opacity:.38}
.pindots{display:flex;gap:14px;justify-content:center;margin:20px 0 14px}
.pindots span{width:18px;height:18px;border-radius:50%;background:#E7DFD3;box-shadow:inset 0 2px 3px rgba(0,0,0,.1)}
.pindots span.on{background:var(--plum)}
.pindots.shakepin{animation:nudge .45s}
.pad.pinpad{padding-bottom:6px}

/* ---------- celebration ---------- */
#cheer{position:fixed;inset:0;display:none;place-items:center;background:rgba(255,246,234,.95);z-index:85;
  flex-direction:column;gap:12px;text-align:center;padding:22px}
#cheer.on{display:flex;align-items:center;justify-content:center}
.conf{position:fixed;width:9px;height:13px;border-radius:2px;pointer-events:none;z-index:95}
</style>
</head>
<body>

<!-- ================= TOWN MAP ================= -->
<section id="map" class="screen on">
  <div class="purse">
    <span class="pill" id="pCoins">🪙 <b>0</b></span>
    <span class="pill" id="pSave">🏦 <b>£0.00</b></span>
    <span class="pill risk" id="pPurse">👛 <b>10p</b></span>
    <span class="grow"></span>
    <button class="ico" id="btnGrown">⚙️</button>
  </div>
  <div id="townwrap">
    <div id="skyline"></div>
    <div class="welcome">
      <h1>Isabel Leyla's Number Town</h1>
      <p id="welcomeLine">Where shall we work today?</p>
    </div>
    <div class="shops" id="shops"></div>
    <div class="mapfoot">
      <button class="btn blue sm" id="btnBank">🏦 My money</button>
      <button class="btn mustard sm" id="btnPayday">🧾 Payday</button>
    </div>
    <div id="street"></div>
  </div>
</section>

<!-- ================= SHOP / QUESTIONS ================= -->
<section id="shop" class="screen">
  <div class="shophead">
    <button class="ico" data-back="map">←</button>
    <div class="who" id="keeperPic"></div>
    <div class="grow">
      <div class="ttl" id="shopName"></div>
      <div class="sub" id="shopSub"></div>
    </div>
    <span class="pill" id="sCoins">🪙 <b>0</b></span>
  </div>
  <div class="qwrap" id="qwrap"></div>
  <div id="answerArea"></div>
</section>

<!-- ================= BANK ================= -->
<section id="bank" class="screen">
  <div class="purse">
    <button class="ico" data-back="map">←</button>
    <h2 style="font-size:18px">My money</h2>
    <span class="grow"></span>
  </div>
  <div class="bankwrap" id="bankwrap"></div>
</section>

<!-- ================= GROWN-UPS ================= -->
<div class="sheet" id="grownSheet">
  <div class="inner" id="grownInner"></div>
</div>

<div id="cheer"></div>

<script>
/* ============================================================
   Isabel Leyla's Number Town — skills & question generators

   The game runs at ONE level: everything up to the end of P4 (First Level).
   That is where Isabel Leyla is at the start of P5, and consolidating it is
   the point.

   Each generator can also produce harder versions of the same skill, ready
   for later in the year. A grown-up switches level from the settings panel:

     gen(rng, L)      L = 0, 1 or 2

     L0  End of P4   — First Level          ← what ships
     L1  Mid P5
     L2  End of P5   — Second Level

   A generated question looks like:

   { q      : prompt text
     svg    : optional picture (SVG or table markup)
     kind   : 'num' | 'choice'
     keys   : 'num' | 'dec' | 'frac' | 'time'   (which keypad)
     ans    : correct answer
     alt    : [other acceptable answers]
     opts   : [choices]   (kind === 'choice')
     unit   : shown after the answer box
     hint   : shown after the first miss
     steps  : worked solution, shown after the second miss }
   ============================================================ */

const SHOPS = [
  { id:'bakery',  name:'The Bakery',   emoji:'🥐', keeper:'Pia',  topic:'Fractions, decimals & percentages' },
  { id:'market',  name:'The Market',   emoji:'🛒', keeper:'Gus',  topic:'Money and the four operations' },
  { id:'cafe',    name:'The Cat Café', emoji:'🐾', keeper:'Nour', topic:'Multiplication & division' },
  { id:'station', name:'The Station',  emoji:'🚂', keeper:'Bram', topic:'Time, timetables & calendars' }
];

const LEVEL_NAMES = ['Warm-up', 'Steady', 'Stretch'];

/* ---------- helpers ---------- */
function ri(r,a,b){ return a + Math.floor(r()*(b-a+1)); }
function pick(r,a){ return a[Math.floor(r()*a.length)]; }
function shuf(r,a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }
function gcd(a,b){ return b?gcd(b,a%b):a; }
function pounds(p){ var s=(p<0?'-':''); p=Math.abs(p); return s+'£'+Math.floor(p/100)+'.'+String(p%100).padStart(2,'0'); }
function pence(p){ return p<100 ? p+'p' : pounds(p); }
function two(n){ return String(n).padStart(2,'0'); }
function hhmm(m){ m=((m%1440)+1440)%1440; return two(Math.floor(m/60))+':'+two(m%60); }
function h12(m){ m=((m%1440)+1440)%1440; var h=Math.floor(m/60)%12; return (h===0?12:h); }
function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }

/* ---------- pictures ---------- */
function barSVG(parts, shaded, w, colour){
  w = w||280; var h=54, seg=w/parts, out='';
  for(var i=0;i<parts;i++){
    out += '<rect x="'+(i*seg)+'" y="0" width="'+seg+'" height="'+h+'" rx="6" '+
           'fill="'+(i<shaded?(colour||'#E4694A'):'#FFF6EA')+'" stroke="#2E2A3B" stroke-width="3"/>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" class="pic">'+out+'</svg>';
}
function pieSVG(parts, shaded){
  var out='', cx=60, cy=60, rr=52;
  for(var i=0;i<parts;i++){
    var a0=(i/parts)*2*Math.PI - Math.PI/2, a1=((i+1)/parts)*2*Math.PI - Math.PI/2;
    var x0=cx+rr*Math.cos(a0), y0=cy+rr*Math.sin(a0), x1=cx+rr*Math.cos(a1), y1=cy+rr*Math.sin(a1);
    var large=(a1-a0)>Math.PI?1:0;
    out += '<path d="M'+cx+' '+cy+' L'+x0+' '+y0+' A'+rr+' '+rr+' 0 '+large+' 1 '+x1+' '+y1+' Z" '+
           'fill="'+(i<shaded?'#F2B33D':'#FFF6EA')+'" stroke="#2E2A3B" stroke-width="3"/>';
  }
  return '<svg viewBox="0 0 120 120" class="pic pic-sm">'+out+'</svg>';
}
function arraySVG(rows, cols){
  var s=18, g=6, w=cols*(s+g)+g, h=rows*(s+g)+g, out='';
  out += '<rect x="0" y="0" width="'+w+'" height="'+h+'" rx="10" fill="#FFF6EA" stroke="#2E2A3B" stroke-width="3"/>';
  for(var y=0;y<rows;y++) for(var x=0;x<cols;x++)
    out += '<circle cx="'+(g+s/2+x*(s+g))+'" cy="'+(g+s/2+y*(s+g))+'" r="'+(s/2-1)+'" fill="#6FB98F"/>';
  return '<svg viewBox="0 0 '+w+' '+h+'" class="pic">'+out+'</svg>';
}
function clockSVG(mins){
  var h=Math.floor(mins/60)%12, m=mins%60;
  var ha=(h+m/60)/12*2*Math.PI - Math.PI/2, ma=(m/60)*2*Math.PI - Math.PI/2;
  var t='';
  for(var i=0;i<12;i++){
    var a=i/12*2*Math.PI - Math.PI/2;
    t += '<text x="'+(60+42*Math.cos(a))+'" y="'+(60+42*Math.sin(a)+5)+'" font-size="13" font-weight="800" '+
         'text-anchor="middle" fill="#2E2A3B">'+(i===0?12:i)+'</text>';
  }
  for(var k=0;k<60;k++){
    var b=k/60*2*Math.PI - Math.PI/2, r0=k%5===0?52:54;
    t += '<line x1="'+(60+r0*Math.cos(b))+'" y1="'+(60+r0*Math.sin(b))+'" x2="'+(60+56*Math.cos(b))+'" y2="'+(60+56*Math.sin(b))+'" stroke="#2E2A3B" stroke-width="'+(k%5===0?2.5:1)+'"/>';
  }
  return '<svg viewBox="0 0 120 120" class="pic pic-sm">'+
    '<circle cx="60" cy="60" r="57" fill="#FFF6EA" stroke="#2E2A3B" stroke-width="4"/>'+t+
    '<line x1="60" y1="60" x2="'+(60+28*Math.cos(ha))+'" y2="'+(60+28*Math.sin(ha))+'" stroke="#2E2A3B" stroke-width="6" stroke-linecap="round"/>'+
    '<line x1="60" y1="60" x2="'+(60+42*Math.cos(ma))+'" y2="'+(60+42*Math.sin(ma))+'" stroke="#E4694A" stroke-width="4" stroke-linecap="round"/>'+
    '<circle cx="60" cy="60" r="4.5" fill="#2E2A3B"/></svg>';
}
function roundLineSVG(lo, hi, val){
  var w=300, pad=30, x=function(v){ return pad+(v-lo)/(hi-lo)*(w-2*pad); };
  var mid=(lo+hi)/2;
  return '<svg viewBox="0 0 '+w+' 64" class="pic">'+
    '<line x1="'+pad+'" y1="30" x2="'+(w-pad)+'" y2="30" stroke="#2E2A3B" stroke-width="3"/>'+
    '<line x1="'+x(lo)+'" y1="20" x2="'+x(lo)+'" y2="40" stroke="#2E2A3B" stroke-width="3"/>'+
    '<line x1="'+x(hi)+'" y1="20" x2="'+x(hi)+'" y2="40" stroke="#2E2A3B" stroke-width="3"/>'+

function coinsSVG(list){
  var out='', x=6;
  list.forEach(function(v){
    var big = v>=100, rr = big?21:(v>=20?19:16);
    var col = v>=100 ? '#C9A227' : (v>=20 ? '#B9BCC2' : '#C98B4B');
    out += '<circle cx="'+(x+rr)+'" cy="26" r="'+rr+'" fill="'+col+'" stroke="#2E2A3B" stroke-width="2.5"/>'+
           '<text x="'+(x+rr)+'" y="31" font-size="12" font-weight="800" text-anchor="middle" fill="#2E2A3B">'+
           (v>=100?'£'+(v/100):v+'p')+'</text>';
    x += rr*2+7;
  });
  return '<svg viewBox="0 0 '+Math.max(x,60)+' 54" class="pic">'+out+'</svg>';
}

        steps:[months[mi]+' has '+lens[mi]+' days.'] };

  for(var i=0;i<30;i++){ (function(i){
    var d=document.createElement('div'); d.className='conf';
    d.style.background=cols[i%cols.length];
    d.style.left=(15+Math.random()*70)+'%'; d.style.top='38%';
    document.body.appendChild(d);
    var dx=(Math.random()-.5)*300, dy=-100-Math.random()*160, rot=Math.random()*720-360;
    try{ d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+(dy+560)+'px) rotate('+rot+'deg)',opacity:0}],
      {duration:1300+Math.random()*700,easing:'cubic-bezier(.2,.6,.4,1)'}); }catch(e){}
    setTimeout(function(){ d.remove(); },2100);
  })(i); }
}
function flyText(txt, colour){
  var d=document.createElement('div'); d.className='fly'; d.textContent=txt;
  d.style.color=colour||'#6FB98F'; d.style.left='50%'; d.style.top='46%'; d.style.transform='translateX(-50%)';
  document.body.appendChild(d);
  try{ d.animate([{transform:'translate(-50%,0)',opacity:1},{transform:'translate(-50%,-70px)',opacity:0}],
    {duration:1000,easing:'ease-out'}); }catch(e){}
  setTimeout(function(){ d.remove(); },1000);
}

function ledger(kind, p, note){
  S.ledger.push({ d:today(), k:kind, p:p, n:note });
  if(S.ledger.length>400) S.ledger.splice(0, S.ledger.length-400);
}
function awardStar(id, name){
  var k=sk(id); if(k.star) return 0;
  k.star=true; S.savedP += ECON.STAR_VALUE;
  ledger('star', ECON.STAR_VALUE, name); save();
  return ECON.STAR_VALUE;
}
function losePurse(reason){
  if(S.today.lost >= ECON.PURSE_MAX_LOSS) return 0;
  if(S.today.purse<=0) return 0;
  S.today.purse -= 1; S.today.lost += 1; save();
  return 1;
}
function bankPurse(silent){
  if(S.today.banked) return 0;
  var room = Math.max(0, ECON.PURSE_LIFETIME - S.purseP);
  var add = Math.min(S.today.purse, room);
  S.today.banked = true;
  if(add>0){ S.purseP += add; ledger('purse', add, 'Careful work bonus'); }
  save(); return add;
}
/* payday = money earned but not yet handed over */
function paydayLines(){
  var since = S.ledger.filter(function(e){ return true; });
  var byDay = {};
  since.forEach(function(e){ byDay[e.d]=(byDay[e.d]||0)+e.p; });
  return byDay;
}

var cur=null;   // {skill, q, tries, usedHint, sawSolution}
var curShop=null;

/* She works on a small handful of skills at a time rather than sampling all
   eight — otherwise a star takes forever to arrive. */
function focusFor(shopId){
  if(!S.focus) S.focus={};
  var mine=SKILLS_BY_SHOP[shopId];
  var list=(S.focus[shopId]||[]).filter(function(id){
    return mine.some(function(k){ return k.id===id; }) && (!skDone(id) || sk(id).shaky>0);
  });
  if(list.length < ECON.FOCUS_SIZE){
    /* a finished skill she has since fumbled comes back into the focus set first */
    var rest=mine.filter(function(k){ return list.indexOf(k.id)<0 && (!skDone(k.id) || sk(k.id).shaky>0); })
                 .sort(function(a,b){
                    var A=sk(a.id), B=sk(b.id);
                    return (B.shaky-A.shaky) || (A.star?1:0)-(B.star?1:0) || A.seen-B.seen;
                 });
    while(list.length < ECON.FOCUS_SIZE && rest.length) list.push(rest.shift().id);
  }
  S.focus[shopId]=list; save();
  return list;
}
function pickSkill(shopId){
  var mine=SKILLS_BY_SHOP[shopId];
  var focus=focusFor(shopId);
  var done=mine.filter(function(k){ return skDone(k.id); });

  /* one question in five revisits something she has fully finished, to keep it
     sharp — and this is the only place the purse is ever at risk */
  if(done.length && (!focus.length || Math.random()<ECON.REVIEW_CHANCE))
    return { skill: done[Math.floor(Math.random()*done.length)], review:true };

  if(!focus.length) return { skill: mine[Math.floor(Math.random()*mine.length)], review:true };

  /* within the focus set, favour the one with fewest clean answers so far */
  var objs=focus.map(function(id){ return mine.filter(function(k){return k.id===id;})[0]; })
                .filter(Boolean)
                .sort(function(a,b){ return sk(a.id).hits - sk(b.id).hits; });
  var pool=objs.slice(0, Math.min(2, objs.length));
  return { skill: pool[Math.floor(Math.random()*pool.length)], review:false };
}

function openShop(id){
  rollDay();
  if(S.today.asked >= ECON.DAILY_QUESTIONS){ show('map'); shiftOver(); return; }
  curShop=id; S.lastShop=id; save();

  $('#shopName').textContent = s.name;
  $('#shopSub').textContent = s.keeper+' · '+s.topic;
  $('#keeperPic').innerHTML = personSVG(s.keeper, SHOP_LOOK[id].wall);
  show('shop'); nextQuestion();
}

function nextQuestion(){
  rollDay(); renderPurseBar();
  if(S.today.asked >= ECON.DAILY_QUESTIONS){ shiftOver(); return; }
  var picked=pickSkill(curShop);
  var L=level();
  var r=rngFrom(Math.floor(Math.random()*4294967295)+1);
  var q;
  try{ q=picked.skill.gen(r, L); }catch(e){ q=picked.skill.gen(rngFrom(12345), L); }
  cur={ skill:picked.skill, q:q, L:L, tries:0, usedHint:false, sawSolution:false, review:picked.review, typed:'' };
  drawQuestion();
}

function drawQuestion(){
  var q=cur.q;
  var pics = q.svg ? '<div class="pics">'+q.svg+'</div>' : '';
  var keeper = SHOPS.filter(function(x){ return x.id===curShop; })[0];

    (q.kind==='num' ? '<div class="abox" id="abox"></div>' : '')+
    '<div id="helpArea"></div>';
  if(q.kind==='num'){ drawAbox(); drawKeypad(); } else { drawChoices(); }
}
function drawAbox(){
  var q=cur.q;
  var pre = q.unit==='£' ? '£' : '';
  var post = (q.unit && q.unit!=='£') ? '<span class="un">'+q.unit+'</span>' : '';
  $('#abox').innerHTML = pre + '<span class="cur">'+(cur.typed||'')+'</span>' + post;
}
function drawKeypad(){
  var extra = cur.q.keys==='dec' ? '.' : cur.q.keys==='frac' ? '/' : cur.q.keys==='time' ? ':' : '';
  var rows=[['7','8','9'],['4','5','6'],['1','2','3'],[extra||'','0','⌫']];
  var html='';
  rows.forEach(function(rw){ rw.forEach(function(k){
    html += k==='' ? '<button class="key dim" disabled></button>'
                   : '<button class="key" data-k="'+k+'">'+k+'</button>';
  });});
  html += '<button class="key go" data-k="ok">Check it</button>';
  $('#answerArea').className='pad'; $('#answerArea').innerHTML=html;
  $$('#answerArea .key').forEach(function(b){
    b.addEventListener('click', function(){

      if(k==='ok'){ checkAnswer(cur.typed); return; }
      if(k==='⌫'){ cur.typed=cur.typed.slice(0,-1); }
      else if(cur.typed.length<8){ cur.typed+=k; }
      sTick(); drawAbox();
    });
  });

function drawChoices(){
  $('#answerArea').className='opts';
  $('#answerArea').innerHTML = cur.q.opts.map(function(o,i){
    return '<button class="opt" data-i="'+i+'">'+o+'</button>';
  }).join('');
  $$('#answerArea .opt').forEach(function(b){
    b.addEventListener('click', function(){ checkAnswer(cur.q.opts[+b.dataset.i], b); });

}

var NUMERIC=/^-?\d*\.?\d+$/;
function same(a,b){
  a=String(a).trim().toLowerCase().replace(/^£/,'').replace(/\s/g,'');
  b=String(b).trim().toLowerCase().replace(/^£/,'').replace(/\s/g,'');
  if(a===b) return true;
  /* times: 7:35 and 07:35 are the same clock face */
  var ta=a.match(/^(\d{1,2}):(\d{2})$/), tb=b.match(/^(\d{1,2}):(\d{2})$/);
  if(ta&&tb) return (+ta[1]%24)===(+tb[1]%24) && ta[2]===tb[2];
  /* plain numbers: 4.50 and 4.5 are the same amount */
  if(NUMERIC.test(a)&&NUMERIC.test(b)) return Math.abs(parseFloat(a)-parseFloat(b))<1e-9;
  return false;
}
function isCorrect(v){
  var q=cur.q;
  if(same(v,q.ans)) return true;
  return (q.alt||[]).some(function(a){ return same(v,a); });
}

function checkAnswer(v, btn){
  if(v===''||v==null){ sHmm(); return; }
  var q=cur.q;
  if(isCorrect(v)) return rightAnswer(btn);
  /* --- wrong --- */
  cur.tries++;
  sHmm();
  if(btn){ btn.classList.add('bad'); btn.disabled=true; }
  var ab=$('#abox'); if(ab){ ab.classList.remove('wrong'); void ab.offsetWidth; ab.classList.add('wrong'); }
  cur.typed=''; if(ab) drawAbox();

  if(cur.tries===1){
    cur.usedHint=true;
    $('#helpArea').innerHTML='<div class="helper">🤔 <b>Have another look.</b> '+q.hint+'</div>'+
      (q.hintSvg?'<div class="pics">'+q.hintSvg+'</div>':'');
    return;
  }

  if(cur.tries===2){
    cur.sawSolution=true;
    var k=sk(cur.skill.id);
    /* a fumble on something she had already earned puts it back in the practice
       set for a while — the money she earned for it is never taken back */
    var dropped=false;
    if(k.star){ k.shaky = Math.min(3, k.shaky+2); dropped=true; }
    save();
    /* the purse is only ever at risk on a skill she has already finished */
    var lost=0;
    if(k.star) lost = losePurse();
    $('#helpArea').innerHTML =
      '<div class="sol"><div class="tag plain" style="opacity:.5">how it works</div>'+
      q.steps.map(function(s){ return '<div>'+s+'</div>'; }).join('')+
      '<div class="ansline">Answer: '+(q.unit==='£'?'£':'')+q.ans+(q.unit&&q.unit!=='£'?' '+q.unit:'')+'</div></div>'+
      (lost ? '<div class="helper" style="margin-top:8px">👛 You had already finished this one — <b>1p</b> off today’s purse. Your bank is untouched.</div>' : '')+
      (dropped ? '<div class="helper" style="margin-top:8px">🙂 We’ll practise this one a few more times. Your star stays where it is.</div>' : '')+
      '<div class="helper" style="margin-top:8px">✍️ Now put that answer in yourself — that is what makes it stick.</div>';
    if(q.kind==='choice') $$('#answerArea .opt').forEach(function(b){ b.disabled=false; b.classList.remove('bad'); });
    renderPurseBar();
    try{ $('#helpArea').scrollIntoView({ block:'end', behavior:'smooth' }); }catch(e){}
    return;
  }

  /* she has the solution in front of her — just nudge, no more cost */
  if(cur.tries===4){
    var skipBtn=document.createElement('button');
    skipBtn.className='btn ghost sm'; skipBtn.style.marginTop='8px';
    skipBtn.textContent='Leave this one for now →';
    skipBtn.addEventListener('click', function(){ finishQuestion(); });
    $('#helpArea').appendChild(skipBtn);
  }
}

function rightAnswer(btn){
  sYes();
  if(btn){ btn.classList.add('good'); }
  var ab=$('#abox'); if(ab) ab.classList.add('right');
  var clean = (cur.tries===0);
  var coins = clean ? 5 : (cur.sawSolution ? 1 : 2);
  S.coins += coins; sCoin();
  flyText('+'+coins+' 🪙', '#B8860B');

  var k=sk(cur.skill.id); k.seen++;
  var earned=0, patched=false;
  if(clean){
    if(k.star && k.shaky>0){ k.shaky--; if(k.shaky===0) patched=true; }   // back on its feet
    else if(!k.star){
      k.hits++;
      if(k.days.indexOf(today())<0) k.days.push(today());
      if(k.hits >= ECON.MASTERY_HITS && k.days.length >= ECON.MASTERY_DAYS)
        earned = awardStar(cur.skill.id, cur.skill.name);
    }
  }
  save();
  $$('#answerArea button').forEach(function(b){ b.disabled=true; });
  if(earned){ setTimeout(function(){ masteryCheer(cur.skill.name, earned); }, 420); }
  else {
    var msg = patched ? 'Back on track with that one.'
            : clean ? ['Nice one!','Spot on.','Exactly right.','That’s it!','Lovely work.'][Math.floor(Math.random()*5)]
                    : 'Got there — that is what counts.';
    $('#helpArea').innerHTML='<div class="helper" style="background:#E4F6EA;box-shadow:0 3px 0 #B9E2C8">✅ <b>'+msg+'</b>'+
      (clean? '' : ' Mistakes are how it sticks.')+'</div>';
    setTimeout(function(){ finishQuestion(true); }, 700);
  }
}

function finishQuestion(){
  S.today.asked++; save();
  if(S.today.asked>=ECON.DAILY_QUESTIONS){ shiftOver(); return; }
  nextQuestion();
}

function renderGate(mode, first){
  var typed='';
  var title = mode==='enter' ? 'Grown-ups only'
            : mode==='set'   ? 'Choose a 4-digit PIN'
            : 'Type it once more';

  function dots(){
    $('#pindots').innerHTML = [0,1,2,3].map(function(i){
      return '<span class="'+(i<typed.length?'on':'')+'"></span>';
    }).join('');
  }
  var rows=[['7','8','9'],['4','5','6'],['1','2','3'],['','0','⌫']];

                  : '<button class="key" data-k="'+k+'">'+k+'</button>';

  dots();

  $$('#pinpad .key').forEach(function(b){
    b.addEventListener('click', function(){
      var k=b.dataset.k;
      if(k==='⌫') typed=typed.slice(0,-1); else if(typed.length<4) typed+=k;
      sTick(); dots();
      if(typed.length===4) setTimeout(function(){ submit(typed); }, 160);
    });
  });
  function bad(){
    tone(220,.2,'sine',.09);
    var d=$('#pindots'); d.classList.remove('shakepin'); void d.offsetWidth; d.classList.add('shakepin');
    typed=''; dots();
  }
  function submit(v){
    if(mode==='enter'){
      if(pinHash(v)===S.pin){ unlocked=true; sYes(); renderGrown(); } else bad();
    } else if(mode==='set'){
      renderGate('confirm', v);
    } else {
      if(v===first){ S.pin=pinHash(v); save(); unlocked=true; sYes(); renderGrown(); }
      else { alert('Those two did not match — let us try again.'); renderGate('set'); }
    }
  }
  var sk2=$('#pinSkip'); if(sk2) sk2.addEventListener('click', function(){ unlocked=true; renderGrown(); });
  $('#pinClose').addEventListener('click', function(){ $('#grownSheet').classList.remove('on'); unlocked=false; });
}

function renderGrown(){
  rollDay();
  var rows='';
  SHOPS.forEach(function(s){
    rows += '<h3 style="margin-top:14px;font-size:14px">'+s.emoji+' '+s.name+'</h3>';
    SKILLS_BY_SHOP[s.id].forEach(function(k){
      var d=sk(k.id), pct=Math.min(100, d.hits/ECON.MASTERY_HITS*100);
      rows += '<div class="skillrow"><span style="flex:0 0 55%;font-size:13px">'+k.name+'</span>'+
        '<span class="bar"><i style="width:'+(d.star?100:pct)+'%"></i></span>'+
        '<span class="st">'+(d.star?(d.shaky?'⭐?':'⭐'):(d.seen?d.hits+'/'+ECON.MASTERY_HITS:'·'))+'</span></div>';
    });
  });
  var shaky = SKILLS.filter(function(k){ var d=sk(k.id); return d.seen>=2 && !d.star && d.hits<=1; })
                    .map(function(k){ return k.name; }).slice(0,5);

  $('#grownInner').innerHTML =
    '<h2>Grown-ups’ corner</h2>'+
    '<p class="muted">Everything stays on this phone. No account, no analytics, nothing sent anywhere.</p>'+

    '<div class="card" style="margin-top:12px"><h3>💷 Payday</h3>'+
      '<div class="row"><span>Total earned</span><span>'+P(totalSavedP())+'</span></div>'+
      '<div class="row"><span>Already paid</span><span>'+P(S.paidP)+'</span></div>'+
      '<div class="row tot"><span>You owe</span><span>'+P(owedP())+'</span></div>'+
      '<div style="margin-top:10px"><button class="btn sage sm" id="btnPaid">Mark as paid</button></div>'+
      '<p class="muted" style="margin-top:8px">'+starCount()+' skills learned × 10p = '+P(S.savedP)+
      '. Careful-work bonus so far '+P(S.purseP)+' (capped at £2.00). '+ECON.TOTAL_SKILLS+
      ' skills planned × 10p + £2 purse = £10.00 maximum.</p>'+
    '</div>'+

    '<div class="card" style="margin-top:10px"><h3>📈 Level</h3>'+
      '<div class="seg" id="lvlSeg">'+LEVEL_NAMES.map(function(n,i){
        return '<button data-l="'+i+'" class="'+(level()===i?'':'off')+'">'+
          ['End of P4','Mid P5','End of P5'][i]+'</button>';
      }).join('')+'</div>'+
      '<p class="muted">The game ships on <b>End of P4</b> — consolidating First Level, which is where she is right now. '+
      'The same skills are already written at the two harder levels; move the dial when school has moved on. '+
      'Changing it does not touch any money already earned.</p></div>'+

    (shaky.length? '<div class="card" style="margin-top:10px"><h3>Worth a look together</h3>'+
      '<p class="muted">'+shaky.join(' · ')+'</p></div>' : '')+

    '<div class="card" style="margin-top:10px"><h3>Shops</h3>'+
      '<div class="seg" id="shopToggles">'+SHOPS.map(function(s){
        return '<button data-s="'+s.id+'" class="'+(S.shopsOn[s.id]?'':'off')+'">'+s.emoji+' '+s.name+'</button>';
      }).join('')+'</div>'+
      '<p class="muted">Turn a shop off to keep her on what school is doing this term.</p></div>'+

    '<div class="card" style="margin-top:10px"><h3>Progress</h3>'+rows+'</div>'+

    '<div class="card" style="margin-top:10px"><h3>Why it is built this way</h3>'+
      '<p class="muted">A skill pays <b>10p</b> once she has answered it correctly — first try, no hint — '+
      ECON.MASTERY_HITS+' times, spread over at least '+ECON.MASTERY_DAYS+
      ' different days. Four right answers in one burst is a good day; still having it two days later is learning, '+
      'and the money follows the second one. She works on '+ECON.FOCUS_SIZE+
      ' skills at a time rather than all eight, so stars actually arrive — about one every 13 questions. '+
      'There are no timers — timed drilling is the best-documented trigger of maths anxiety at this age. '+
      'Wrong answers never touch the bank: a first miss brings a hint, a second brings the worked solution, '+
      'and only a mistake on a skill she has already earned a star for costs 1p of that day’s purse (max '+
      ECON.PURSE_MAX_LOSS+'p a day). The day stops after '+ECON.DAILY_QUESTIONS+' questions.</p></div>'+

    '<div class="card" style="margin-top:10px"><h3>🔒 Grown-ups’ PIN</h3>'+
      '<p class="muted">'+(S.pin
        ? 'A PIN is set. This panel — and the reset button — stay locked without it. It keeps a curious nine-year-old out; it is a latch, not a safe.'
        : 'No PIN yet. Set one so the bank and the progress cannot be reset without you.')+'</p>'+
      '<div style="display:flex;gap:8px;margin-top:9px;flex-wrap:wrap">'+
        '<button class="btn blue sm" id="btnPin">'+(S.pin?'Change PIN':'Set a PIN')+'</button>'+
        (S.pin?'<button class="btn ghost sm" id="btnPinOff">Remove PIN</button>':'')+
      '</div></div>'+

    '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'+
      '<button class="btn sm" id="btnClose">Done</button>'+
      '<button class="btn ghost sm" id="btnReset">Reset everything</button></div>';

  $('#btnPin').addEventListener('click', function(){ renderGate('set'); });
  var off=$('#btnPinOff'); if(off) off.addEventListener('click', function(){
    if(confirm('Remove the PIN? Anyone using this phone will then be able to reset the money.')){
      S.pin=''; save(); renderGrown();
    }
  });
  $('#btnClose').addEventListener('click', function(){ $('#grownSheet').classList.remove('on'); unlocked=false; renderMap(); });
  $('#btnPaid').addEventListener('click', function(){
    S.paidP = totalSavedP(); save(); renderGrown();
  });
  $('#btnReset').addEventListener('click', function(){
    if(confirm('Erase all progress and money?')){
      var keepPin=S.pin;
      S={ skills:{}, coins:0, savedP:0, purseP:0, paidP:0,
          today:{date:'',purse:ECON.PURSE_DAILY,lost:0,asked:0,banked:false},
          ledger:[], shopsOn:{bakery:1,market:1,cafe:1,station:1}, lastShop:'bakery', pin:keepPin, focus:{} };
      rollDay(); save(); renderGrown(); renderMap();
    }
  });
  $$('#lvlSeg button').forEach(function(b){
    b.addEventListener('click', function(){
      S.level = +b.dataset.l; save(); renderGrown();
    });
  });
  $$('#shopToggles button').forEach(function(b){
    b.addEventListener('click', function(){
      var id=b.dataset.s, on=!S.shopsOn[id];
      var count=SHOPS.filter(function(s){ return S.shopsOn[s.id]; }).length;
      if(!on && count<=1) return;
      S.shopsOn[id]=on?1:0; save(); renderGrown();
    });
  });
}

/* ---------- boot ---------- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
/* debug hooks — used by the automated tests */
try{ window.__person=personSVG; window.__state=function(){return S;}; window.__cur=function(){return cur;}; }catch(e){}
rollDay();
renderMap();

})();

</script>
</body>
</html>
